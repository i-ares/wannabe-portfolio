<body>
<div id="app">
  <header id="top">
    <div class="brand">The People <i>vs.</i> Soham Bhar</div>
    <div id="meterWrap" aria-label="Jury progress"><span>Jury</span><div id="meter"><i></i></div></div>
    <div class="btns">
      <button id="objBtn" class="tbtn hot" type="button" hidden>Objection!</button>
      <button id="idxBtn" class="tbtn" type="button">Case index</button>
      <button id="recBtn" class="tbtn" type="button">Court record</button>
      <button id="muteBtn" class="tbtn" type="button">Sound on</button>
    </div>
  </header>

  <main id="stage" aria-live="polite"><noscript><p style="padding:24px;font-size:16px;line-height:1.6">This portfolio is a small interactive courtroom and needs JavaScript. Contact: sohambhar.sb@gmail.com</p></noscript></main>

  <section id="dialog" hidden aria-label="Speaker">
    <div class="in">
      <div id="portrait" aria-hidden="true"></div>
      <div class="body"><div id="speaker"></div><div id="text"></div><div id="choices"></div></div>
      <button id="next" class="btn amber" type="button">Continue &rarr;</button>
    </div>
  </section>

  <aside id="record" hidden>
    <div class="rh"><span>Court record</span><button id="recClose" class="tbtn" type="button">Close</button></div>
    <div id="recList"></div>
  </aside>

  <div id="toast" role="status"></div>
  <div id="modal" hidden></div>
</div>
